[project]
name = "tinytalk"
description = "OpenAI-compatible TTS server for modest machines"
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ email = "calebwastler@gmail.com" }]
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "numpy",
  "spacy",
]

[project.optional-dependencies]
neutts = [
  "neutts[all]",
  "torch",
  "librosa",
  "praat-parselmouth",
]
tinytauk = [
  "tinytauk @ https://github.com/datGryphon/tinytauk/archive/refs/tags/v0.1.0.tar.gz",
]
test = [
  "pytest",
  "httpx",
  "openai-whisper",
]

[tool.setuptools.packages.find]
include = ["tinytalk*"]

[tool.setuptools.dynamic]
version = { attr = "tinytalk.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
