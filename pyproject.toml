[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tinytalk"
version = "0.1.3"
description = "OpenAI-compatible TTS server for modest machines"
requires-python = ">=3.13,<3.14"
authors = [{ email = "calebwastler@gmail.com" }]
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "numpy",
  "spacy",
]

[project.optional-dependencies]
neutts = [
  "neutts[all]==1.4.1",
  "librosa",
  "praat-parselmouth",
]
tinytauk = [
  "tinytauk @ https://github.com/datGryphon/tinytauk/archive/refs/tags/v0.2.0.tar.gz",
  "torchvision",
]
omnivoice = [
  "omnivoice==0.2.1",
]
inflect = [
  "torch==2.11.0",
  "transformers==5.17.0",
  "numpy==2.4.2",
  "spacy==3.8.16",
  "misaki==0.9.4",
  "espeakng-loader==0.2.4",
  "phonemizer-fork==3.3.2",
  "loguru==0.7.3",
  "attrs==26.1.0",
  "num2words==0.5.14",
  "regex==2026.9.29",
  "addict==2.4.0",
  "soundfile==0.13.1",
  "PyYAML==6.0.3",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
test = [
  "pytest",
  "httpx",
  "openai-whisper",
]

[tool.uv]
override-dependencies = [
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "transformers==5.17.0",
  "neucodec @ https://github.com/datGryphon/neucodec/archive/6954b1f877963e19177b43be1ef56b1818990d31.tar.gz",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
include = ["tinytalk*"]

[tool.semantic_release]
allow_zero_version = true
version_toml = ["pyproject.toml:project.version"]
build_command = "uv lock"
assets = ["uv.lock"]

[tool.semantic_release.remote]
token = { env = "GH_TOKEN" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
