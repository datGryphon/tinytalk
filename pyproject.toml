[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tinytalk"
version = "0.1.3"
description = "OpenAI-compatible TTS server for modest machines"
requires-python = ">=3.13,<3.14"
authors = [{ email = "calebwastler@gmail.com" }]
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "numpy",
  "pydantic>=2.11",
  "spacy",
]

[project.optional-dependencies]
neutts = [
  "neutts[all]==1.4.1",
  "librosa",
  "praat-parselmouth",
]
tinytauk = [
  "tinytauk @ https://github.com/datGryphon/tinytauk/archive/refs/tags/v0.2.0.tar.gz",
  "torchvision",
]
omnivoice = [
  "omnivoice==0.2.1",
]
chatterbox_nano = [
  "chatterbox-tts @ https://github.com/resemble-ai/chatterbox/archive/ab55923c27757c90cfcc407baa57dc25a7d25217.tar.gz",
]
silencio2 = [
  "torch",
  "huggingface-hub",
  "pyyaml",
  "sentencepiece>=0.2.1",
  "tokenizers>=0.21",
  "safetensors>=0.4",
  "scipy>=1.5",
  "einops>=0.4",
  "requests>=2.20",
  "soundfile>=0.12",
]
test = [
  "pytest",
  "httpx",
  "openai-whisper",
]

[tool.uv]
override-dependencies = [
  "resemble-perth==1.0.1",
  "safetensors>=0.8.0",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "transformers==5.17.0",
  "neucodec @ https://github.com/datGryphon/neucodec/archive/6954b1f877963e19177b43be1ef56b1818990d31.tar.gz",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
include = ["tinytalk*"]

[tool.semantic_release]
allow_zero_version = true
version_toml = ["pyproject.toml:project.version"]
build_command = "uv lock"
assets = ["uv.lock"]

[tool.semantic_release.remote]
token = { env = "GH_TOKEN" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
