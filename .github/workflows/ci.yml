name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: uv.lock / Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.17'
          enable-cache: false

      - name: Verify lockfile is current
        run: |
          uv lock
          git diff --exit-code -- uv.lock

  native:
    name: Native Ubuntu / Shared runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TINYTALK_BACKEND: neutts

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.17'
          enable-cache: false

      - name: Install system audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng libsndfile1

      - name: Sync all backends
        run: uv sync --frozen --all-extras --python 3.13

      - name: Verify installation outside the checkout
        run: .venv/bin/python -I -c 'import importlib.metadata as m, tinytalk; assert m.version("tinytalk") == tinytalk.__version__'

      - name: Run all backend and shared tests
        run: .venv/bin/python -m pytest tests --ignore=tests/integration -q

  nix:
    name: Nix / Shared runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TINYTALK_BACKEND: neutts

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - name: Check flake and NixOS module
        run: nix flake check

      - name: Run all backend and shared tests
        run: nix develop -c python -m pytest tests --ignore=tests/integration -q

  nix-upgrade:
    name: Nix upgrade / NeuTTS environment
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.17'
          enable-cache: false

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Exercise upgrade from previous release
        run: tests/ci/test_nix_upgrade.sh

  release:
    name: Python Semantic Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - lockfile
      - native
      - nix
      - nix-upgrade
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Pin checkout to tested commit
        run: git reset --hard "${{ github.sha }}"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.17'
          enable-cache: false

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx --from 'python-semantic-release==10.7.0' semantic-release version
