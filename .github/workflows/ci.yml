name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/omnivoice-backend

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native Ubuntu / ${{ matrix.backend }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [neutts, omnivoice]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.17"
          enable-cache: false

      - name: Install system audio libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng libsndfile1

      - name: Install Python and backend without Nix
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          uv python install 3.13
          uv venv --python 3.13 .venv
          uv pip install \
            --python .venv/bin/python \
            --index-url https://pypi.org/simple \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            --override "nix/overrides/${BACKEND}.txt" \
            -e ".[${BACKEND},test]"

      - name: Verify runtime and run unit tests
        env:
          TINYTALK_BACKEND: ${{ matrix.backend }}
        run: |
          source .venv/bin/activate
          bash scripts/ci-smoke.sh

  nix:
    name: Nix / ${{ matrix.shell }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shell: [default, omnivoice]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - name: Check flake
        if: matrix.shell == 'default'
        run: nix flake check

      - name: Verify runtime and run unit tests
        run: nix develop .#${{ matrix.shell }} -c bash scripts/ci-smoke.sh
