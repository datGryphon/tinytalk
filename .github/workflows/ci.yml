name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native Ubuntu / ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: neutts
            label: NeuTTS
            override-file: nix/overrides/neutts.txt
          - backend: omnivoice
            label: OmniVoice
            override-file: nix/overrides/omnivoice.txt
          - backend: tinytauk
            label: TinyTAuK
            override-file: ''

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up native backend
        id: setup
        uses: ./.github/actions/setup-native
        with:
          extras: ${{ matrix.backend }},test
          override-file: ${{ matrix.override-file }}

      - name: Check backend
        uses: ./.github/actions/check-backend
        with:
          backend: ${{ matrix.backend }}
          python-path: ${{ steps.setup.outputs.python-path }}

  nix:
    name: Nix / ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: neutts
            label: NeuTTS
            shell: default
          - backend: omnivoice
            label: OmniVoice
            shell: omnivoice
          - backend: tinytauk
            label: TinyTAuK
            shell: tinytauk

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - name: Check flake and NixOS module
        if: matrix.backend == 'neutts'
        run: nix flake check

      - name: Check backend
        uses: ./.github/actions/check-backend
        with:
          backend: ${{ matrix.backend }}
          nix-shell: ${{ matrix.shell }}

  shared:
    name: Native Ubuntu / Shared runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up shared native runtime
        id: setup
        uses: ./.github/actions/setup-native
        with:
          extras: neutts,omnivoice,tinytauk,test
          override-file: nix/overrides/neutts.txt

      - name: Check NeuTTS in shared runtime
        uses: ./.github/actions/check-backend
        with:
          backend: neutts
          python-path: ${{ steps.setup.outputs.python-path }}

      - name: Check OmniVoice in shared runtime
        uses: ./.github/actions/check-backend
        with:
          backend: omnivoice
          python-path: ${{ steps.setup.outputs.python-path }}

      - name: Check TinyTAuK in shared runtime
        uses: ./.github/actions/check-backend
        with:
          backend: tinytauk
          python-path: ${{ steps.setup.outputs.python-path }}
