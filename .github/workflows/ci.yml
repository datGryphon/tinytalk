name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native Ubuntu / ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: neutts
            label: NeuTTS
          - backend: omnivoice
            label: OmniVoice
          - backend: tinytauk
            label: TinyTAuK

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.17"
          enable-cache: false

      - name: Install system audio libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng libsndfile1

      - name: Install Python and backend without Nix
        run: bash .github/scripts/install-native.sh ${{ matrix.backend }}

      - name: Verify runtime and run unit tests
        env:
          TINYTALK_BACKEND: ${{ matrix.backend }}
        run: |
          source .venv/bin/activate
          bash .github/scripts/check-backend.sh

  nix:
    name: Nix / ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: neutts
            label: NeuTTS
            shell: default
          - backend: omnivoice
            label: OmniVoice
            shell: omnivoice
          - backend: tinytauk
            label: TinyTAuK
            shell: tinytauk

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - name: Check flake
        if: matrix.backend == 'neutts'
        run: nix flake check

      - name: Verify runtime and run unit tests
        run: nix develop .#${{ matrix.shell }} -c bash .github/scripts/check-backend.sh

  shared:
    name: Native Ubuntu / Shared runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.17"
          enable-cache: false

      - name: Install system audio libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng libsndfile1

      - name: Resolve all three backends in one environment
        run: bash .github/scripts/install-native.sh shared

      - name: Run backend checks in the shared environment
        run: |
          source .venv/bin/activate
          for backend in neutts omnivoice tinytauk; do
            TINYTALK_BACKEND="$backend" bash .github/scripts/check-backend.sh
          done
