name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - tinytalk/__init__.py

permissions:
  contents: write

jobs:
  publish:
    name: Tag and publish release
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Read release version
        id: version
        run: |
          set -euo pipefail

          version="$(
            python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("tinytalk/__init__.py").read_text()
          match = re.search(r'^__version__ = "([0-9]+\.[0-9]+\.[0-9]+)"$', text, re.MULTILINE)
          if match is None:
              raise SystemExit("tinytalk.__version__ is not an X.Y.Z release version")
          print(match.group(1))
          PY
          )"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Validate existing tag
        id: tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            target="$(git rev-list -n 1 "$TAG")"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "$TAG already points to $target, not $GITHUB_SHA" >&2
              exit 1
            fi
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create annotated tag
        if: steps.tag.outputs.create == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "$TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists"
            exit 0
          fi

          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
