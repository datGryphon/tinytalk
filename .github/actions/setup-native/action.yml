name: Set up native Python environment
description: Sync a locked TinyTalk project environment with the requested extras.

inputs:
  extras:
    description: JSON array of TinyTalk extras to install.
    required: true
  python-version:
    description: Python version used for the environment.
    required: false
    default: '3.13'

outputs:
  python-path:
    description: Absolute path to the synced Python interpreter.
    value: ${{ steps.paths.outputs.python-path }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: '0.12.17'
        enable-cache: false

    - name: Install system audio dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng libsndfile1

    - name: Sync locked environment
      shell: bash
      env:
        EXTRAS: ${{ inputs.extras }}
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        jq -e 'type == "array" and all(.[]; type == "string")' <<< "$EXTRAS" >/dev/null
        mapfile -t extras < <(jq -r '.[]' <<< "$EXTRAS")
        extra_args=()
        for extra in "${extras[@]}"; do
          extra_args+=(--extra "$extra")
        done

        uv python install "$PYTHON_VERSION"
        UV_PROJECT_ENVIRONMENT="$GITHUB_WORKSPACE/.venv" \
          uv sync \
            --frozen \
            --python "$PYTHON_VERSION" \
            "${extra_args[@]}"

    - name: Publish interpreter path
      id: paths
      shell: bash
      run: echo "python-path=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_OUTPUT"
